<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetainlyAI - Opening Animation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f17;
            color: #f8fafc;
            overflow: hidden;
        }

        /* Ambient background glow for depth */
        .ambient-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, rgba(11, 15, 23, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .logo-path {
            stroke-dasharray: 300;
            stroke-dashoffset: 300;
            animation: drawLine 1.4s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        @keyframes drawLine {
            to {
                stroke-dashoffset: 0;
            }
        }

        .fade-scale-in {
            opacity: 0;
            transform: scale(0.96);
            animation: fadeScaleIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
        }

        @keyframes fadeScaleIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Tagline delayed fade-in */
        .tagline-fade {
            opacity: 0;
            transform: translateY(6px);
            animation: taglineFade 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.95s forwards;
        }

        @keyframes taglineFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .progress-bar-fill {
            width: 0%;
            animation: fillProgress 1.5s cubic-bezier(0.65, 0, 0.35, 1) 1.1s forwards;
        }

        @keyframes fillProgress {
            to {
                width: 100%;
            }
        }

        .splash-exit {
            animation: fadeOutContainer 0.7s cubic-bezier(0.4, 0, 0.2, 1) 2.8s forwards;
        }

        @keyframes fadeOutContainer {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        /* Replay button entrance */
        .replay-btn {
            opacity: 0;
            animation: fadeInReplay 0.5s ease 3.5s forwards;
        }

        @keyframes fadeInReplay {
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative">

    <!-- Ambient Glow Element -->
    <div class="ambient-glow"></div>

    <div id="splash-screen" class="splash-exit absolute inset-0 bg-[#0b0f17] flex flex-col items-center justify-center z-50">
        
        <div class="flex flex-col items-center space-y-5 max-w-sm px-6 text-center">
            
            <!-- Crisp Minimal Custom Geometric Logo (Interlocking R & People Nodes) -->
            <div class="relative w-16 h-16 flex items-center justify-center">
                <svg class="w-full h-full text-indigo-400 drop-shadow-[0_0_12px_rgba(99,102,241,0.25)]" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Geometric R: clean line construction with outward accent lines -->
                    <path class="logo-path" d="M16 52V12H36C43.732 12 50 18.268 50 26C50 33.732 43.732 40 36 40H16" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <path class="logo-path" style="animation-delay: 0.22s;" d="M34 40L50 52" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                    <path class="logo-path" style="animation-delay: 0.38s;" d="M36 12L45 6M36 40L45 46M16 12L10 6M16 52L10 58" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </div>

            <div class="fade-scale-in">
                <h1 class="text-2xl font-medium tracking-tight text-white">Retainly<span class="text-indigo-400 font-semibold">AI</span></h1>
            </div>

            <p class="tagline-fade text-xs text-slate-400 font-light tracking-wide leading-relaxed">
                Anticipate turnover, anchor your talent.
            </p>

            <div class="w-40 h-[2px] bg-slate-800/80 rounded-full overflow-hidden mt-4">
                <div class="progress-bar-fill h-full bg-gradient-to-r from-indigo-500 via-indigo-400 to-cyan-400 rounded-full"></div>
            </div>

        </div>
    </div>

    <div class="flex flex-col items-center justify-center text-center p-6 space-y-4 max-w-md z-10">
        <div class="w-12 h-12 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 shadow-lg shadow-indigo-500/5">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        </div>
        <h2 class="text-xl font-semibold tracking-tight text-white">RetainlyAI Dashboard</h2>
        <p class="text-sm text-slate-400 leading-relaxed">Attrition analytics engine loaded successfully. Monitoring active workforce sentiment and preventive risk vectors.</p>
        
        <button onclick="restartAnimation()" class="replay-btn px-4 py-2 text-xs font-medium bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 rounded-lg border border-slate-700/60 transition shadow-sm cursor-pointer mt-3">
            Replay Opening Animation
        </button>
    </div>

    <script>
        function restartAnimation() {
            const splash = document.getElementById('splash-screen');
            splash.style.display = 'none';
            void splash.offsetWidth; // Trigger DOM reflow
            splash.style.display = 'flex';
        }
    </script>

</body>
</html>
