1<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workforce Pulse | Dashboard Loop</title>
<style>
:root{--bg:#050d1a;--panel:rgba(12,28,52,.62);--line:rgba(120,170,255,.14);--ink:#dce9ff;--mute:#7f97bd;--blue:#3d8bff;--green:#2ee6a6;--amber:#ffb84a;--red:#ff5a6e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
body{padding:max(14px,env(safe-area-inset-top,0px)) 16px max(14px,env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse at 20% 0%,#0a2447 0,transparent 55%),radial-gradient(ellipse at 90% 100%,#06302f 0,transparent 50%),var(--bg)}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr;gap:12px;max-width:1500px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.2px}
.live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.35}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;backdrop-filter:blur(8px);min-height:0;position:relative}
.k small{color:var(--mute);font-size:12px}
.k b{display:block;font-size:26px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.k i{font-style:normal;font-size:12px}
.main{display:grid;grid-template-columns:1.5fr 1fr;grid-template-rows:1.25fr 1fr;gap:12px;min-height:0}
.main .card{display:flex;flex-direction:column}
.t{font-size:12px;color:var(--mute);margin-bottom:8px;display:flex;justify-content:space-between}
.leg span{margin-left:12px}.leg em{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
canvas{width:100%;flex:1;min-height:0;display:block}
.line{grid-row:1}.heat{grid-column:2;grid-row:1/3}.ai{grid-row:2}
#hm{display:grid;gap:4px;flex:1;min-height:0;grid-template-columns:96px repeat(10,1fr);align-items:stretch}
#hm .l{font-size:11px;color:var(--mute);display:flex;align-items:center;justify-content:space-between;padding-right:6px}
#hm .c{border-radius:4px;min-height:14px}
.scale{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mute);margin-top:10px}
.scale div{flex:1;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--green),var(--amber),var(--red))}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.main{grid-template-columns:1fr;grid-template-rows:1fr 1fr 1.2fr;overflow:auto}.heat{grid-column:1;grid-row:3}.ai{grid-row:2}body{overflow:auto}}
</style>
</head>
<body>
<div class="app">
<header><h1>Workforce Pulse</h1><div class="live"><span class="dot"></span>Live · processing 48,210 signals</div></header>
<section class="kpis">
<div class="card k"><small>Sentiment index</small><b id="k1">0</b><i id="d1"></i></div>
<div class="card k"><small>Teams at risk</small><b id="k2">0</b><i id="d2"></i></div>
<div class="card k"><small>Engagement</small><b id="k3">0</b><i id="d3"></i></div>
<div class="card k"><small>Attrition forecast</small><b id="k4">0</b><i id="d4"></i></div>
</section>
<section class="main">
<div class="card line"><div class="t"><span>Sentiment trend</span><span class="leg"><span><em style="background:#3d8bff"></em>Company</span><span><em style="background:#2ee6a6"></em>Engineering</span><span><em style="background:#ffb84a"></em>Support</span></span></div><canvas id="ln"></canvas></div>
<div class="card heat"><div class="t"><span>Department risk</span><span>last 10 weeks</span></div><div id="hm"></div><div class="scale">Low<div></div>High</div></div>
<div class="card ai"><div class="t"><span>Signal processing</span><span>Surveys · Chat · HRIS</span></div><canvas id="ai"></canvas></div>
</section>
</div>
<script>
const T=16,TAU=Math.PI*2,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const depts=['Engineering','Sales','Support','Finance','Product','Marketing','Operations','Legal'];
const COLS=10;
const hm=document.getElementById('hm');
const cells=[],risk=[];
depts.forEach((d,i)=>{
  const l=document.createElement('div');l.className='l';l.innerHTML=`<span>${d}</span><b style="font-weight:500;color:#cfe0ff" id="r${i}"></b>`;hm.appendChild(l);
  cells[i]=[];
  for(let j=0;j<COLS;j++){const c=document.createElement('div');c.className='c';hm.appendChild(c);cells[i][j]=c}
});
hm.style.gridTemplateRows=`repeat(${depts.length},1fr)`;
function heatCol(v){ // 0 green -> .5 amber -> 1 red
  const g=[46,230,166],a=[255,184,74],r=[255,90,110];
  const [p,q,f]=v<.5?[g,a,v*2]:[a,r,(v-.5)*2];
  return p.map((x,i)=>Math.round(x+(q[i]-x)*f));
}
const $=id=>document.getElementById(id);
function sz(cv){const D=Math.min(devicePixelRatio||1,2),b=cv.getBoundingClientRect();cv.width=b.width*D;cv.height=b.height*D;return D}
const ln=$('ln'),lx=ln.getContext('2d'),ai=$('ai'),ax=ai.getContext('2d');
let LD=1,AD=1;function rs(){LD=sz(ln);AD=sz(ai)}addEventListener('resize',rs);rs();
// periodic signals: scroll via integer cycles so the loop is seamless
const sig=[
 (x,u)=>.55+.16*Math.sin(TAU*(x*1.3+u*1))+.07*Math.sin(TAU*(x*3.1+u*2)),
 (x,u)=>.68+.12*Math.sin(TAU*(x*1.9+u*1+.2))+.06*Math.sin(TAU*(x*4+u*3)),
 (x,u)=>.42+.17*Math.sin(TAU*(x*1.1+u*1+.6))+.05*Math.sin(TAU*(x*3.7+u*2))
];
const cols=['61,139,255','46,230,166','255,184,74'];
function drawLine(u){
  const w=ln.width,h=ln.height,D=LD,pl=34*D,pb=18*D,pt=6*D;
  lx.clearRect(0,0,w,h);
  lx.font=`${10*D}px system-ui`;lx.fillStyle='#6f87ad';lx.strokeStyle='rgba(120,170,255,.1)';lx.lineWidth=D;
  for(let i=0;i<=4;i++){const y=pt+(h-pt-pb)*i/4;lx.beginPath();lx.moveTo(pl,y);lx.lineTo(w,y);lx.stroke();lx.fillText(100-i*20,2*D,y+3*D)}
  sig.forEach((f,k)=>{
    const pts=[];
    for(let i=0;i<=120;i++){const s=i/120;pts.push([pl+s*(w-pl),pt+(h-pt-pb)*(1-f(s,u))])}
    const path=()=>{lx.beginPath();pts.forEach((p,i)=>i?lx.lineTo(p[0],p[1]):lx.moveTo(p[0],p[1]))};
    if(k===0){path();lx.lineTo(w,h-pb);lx.lineTo(pl,h-pb);const g=lx.createLinearGradient(0,pt,0,h);g.addColorStop(0,'rgba(61,139,255,.26)');g.addColorStop(1,'rgba(61,139,255,0)');lx.fillStyle=g;lx.fill()}
    lx.lineJoin='round';lx.lineCap='round';
    lx.shadowColor=`rgb(${cols[k]})`;lx.shadowBlur=14*D;lx.strokeStyle=`rgba(${cols[k]},${k?0.8:1})`;lx.lineWidth=(k?1.6:2.4)*D;path();lx.stroke();lx.shadowBlur=0;
    const e=pts[pts.length-1],pu=.5+.5*Math.sin(TAU*u*4);
    const gr=lx.createRadialGradient(e[0],e[1],0,e[0],e[1],(8+6*pu)*D);gr.addColorStop(0,`rgba(${cols[k]},.9)`);gr.addColorStop(1,`rgba(${cols[k]},0)`);
    lx.fillStyle=gr;lx.beginPath();lx.arc(e[0],e[1],(8+6*pu)*D,0,TAU);lx.fill();
  });
  // time cursor
  const cx=pl+(w-pl)*((u*2)%1);lx.strokeStyle='rgba(46,230,166,.25)';lx.lineWidth=D;lx.beginPath();lx.moveTo(cx,pt);lx.lineTo(cx,h-pb);lx.stroke();
}
// AI nodes: 3 source columns -> hidden layer -> output
const L=[3,5,4,2],NP=[];
function layout(w,h){NP.length=0;L.forEach((n,i)=>{const col=[];for(let j=0;j<n;j++)col.push([w*(.1+.8*i/(L.length-1)),h*(.15+.7*(n===1?.5:j/(n-1)))]);NP.push(col)})}
function drawAI(u){
  const w=ai.width,h=ai.height,D=AD;layout(w,h);ax.clearRect(0,0,w,h);
  let idx=0;
  for(let i=0;i<L.length-1;i++)NP[i].forEach((a,j)=>NP[i+1].forEach((b,m)=>{
    const o=((j*7+m*3+i*5)%10)/10;
    const g=i/(L.length-2);
    ax.strokeStyle=`rgba(${g>.5?'46,230,166':'61,139,255'},.14)`;ax.lineWidth=D;ax.beginPath();ax.moveTo(a[0],a[1]);ax.lineTo(b[0],b[1]);ax.stroke();
    const p=(u*2+o)%1,f=Math.sin(p*Math.PI);
    if((j+m+i)%2===0){const x=a[0]+(b[0]-a[0])*p,y=a[1]+(b[1]-a[1])*p;
      const gr=ax.createRadialGradient(x,y,0,x,y,9*D);const c=g>.5?'46,230,166':'61,139,255';gr.addColorStop(0,`rgba(${c},${.9*f})`);gr.addColorStop(1,`rgba(${c},0)`);ax.fillStyle=gr;ax.beginPath();ax.arc(x,y,9*D,0,TAU);ax.fill()}
  }));
  NP.forEach((col,i)=>col.forEach((p,j)=>{
    const a=.5+.5*Math.sin(TAU*(u*2-i*.18+j*.07)),c=i>2?'46,230,166':'61,139,255';
    const gl=ax.createRadialGradient(p[0],p[1],0,p[0],p[1],16*D);gl.addColorStop(0,`rgba(${c},${.15+.4*a})`);gl.addColorStop(1,`rgba(${c},0)`);
    ax.fillStyle=gl;ax.beginPath();ax.arc(p[0],p[1],16*D,0,TAU);ax.fill();
    ax.fillStyle=`rgb(${c})`;ax.beginPath();ax.arc(p[0],p[1],3.5*D,0,TAU);ax.fill();
  }));
}
function drawHeat(u){
  depts.forEach((d,i)=>{let s=0;
    for(let j=0;j<COLS;j++){
      // base riskiness per dept + travelling wave; integer cycles in u keep the loop seamless
      const base=[.35,.5,.62,.3,.45,.4,.55,.25][i];
      const v=Math.min(1,Math.max(0,base+.34*Math.sin(TAU*(u*1+i*.11+j*.06))+.12*Math.sin(TAU*(u*2-j*.13+i*.3))));
      const [r,g,b]=heatCol(v);cells[i][j].style.background=`rgba(${r},${g},${b},${.35+.5*v})`;
      cells[i][j].style.boxShadow=v>.72?`0 0 10px rgba(${r},${g},${b},.55)`:'none';s+=v}
    const avg=s/COLS;$('r'+i).textContent=Math.round(avg*100);
  });
}
function drawKpi(u){
  const w=x=>.5+.5*Math.sin(TAU*(u+x));
  $('k1').textContent=(72+8*w(0)).toFixed(1);
  $('d1').innerHTML=`<span style="color:#2ee6a6">▲ ${(1+2*w(.1)).toFixed(1)}</span> <span style="color:#7f97bd">vs last week</span>`;
  const n=Math.round(2+4*w(.3));$('k2').textContent=n;
  $('d2').innerHTML=`<span style="color:${n>4?'#ff5a6e':'#ffb84a'}">${n>4?'Needs attention':'Monitoring'}</span>`;
  $('k3').textContent=Math.round(64+10*w(.55))+'%';
  $('d3').innerHTML=`<span style="color:#3d8bff">Surveys, chat, 1:1s</span>`;
  $('k4').textContent=(6+2.5*w(.8)).toFixed(1)+'%';
  $('d4').innerHTML=`<span style="color:#7f97bd">Next 90 days</span>`;
}
function frame(now){
  const u=reduce?.3:((now/1000)%T)/T;
  drawLine(u);drawAI(u);drawHeat(u);drawKpi(u);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
